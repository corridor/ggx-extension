name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: light-job
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run package
      - name: Check VSIX allowlist
        run: python3 scripts/check-vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: ggx-mcp-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14

  extension-host:
    runs-on: light-job
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.102.0", "stable"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
